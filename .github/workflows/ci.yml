name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Fast, fully offline tests. The rest of the suite talks to YouTube and drives
  # a browser, which is why it is not part of CI (see README → Testing).
  unit:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run offline tests
        run: node --no-warnings --test --test-concurrency=1 test/db.test.js test/search-rank.test.js

  # Build the production image on every PR and publish it to GHCR on main/tags.
  image:
    name: Build container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects uppercase repository names; normalise once, use everywhere.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          # Load locally as well, so the smoke test below always has an image.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually boots, not just that it built: the entrypoint
      # accepts the secret, the server binds, and /api/health returns ok.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          IMAGE="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Testing $IMAGE"

          cleanup() { docker rm -f sonora-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name sonora-smoke \
            -e SONORA_SECRET="$(openssl rand -hex 32)" \
            -e SONORA_USER=ci \
            -e SONORA_PASSPHRASE=ci-passphrase \
            -e SONORA_DB=/app/data/sonora.db \
            -e SONORA_AUDIO_DIR=/app/data/audio \
            -p 8130:8130 \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8130/api/health >/dev/null 2>&1; then
              echo "Healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::Image did not become healthy in 30s"
              docker logs sonora-smoke
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8130/api/health | tee /tmp/health.json
          node -e "const b=require('/tmp/health.json'); if(b.ok!==true) process.exit(1)"
          docker exec sonora-smoke node scripts/healthcheck.js
          echo "Smoke test passed."
