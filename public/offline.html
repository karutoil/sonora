<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111215">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="sonora">
<title>sonora — offline</title>
<script>/* --app-h: iOS home-screen chin fix. Keep identical in index.html and offline.html (test/ios-chin.test.js compares them). */
(function () {
  // An iOS home-screen web app can report a layout viewport shorter than the
  // physical screen: WebKit subtracts the safe-area strip, so 100dvh (and
  // innerHeight) come back 20-59px short while screen.height stays honest. A
  // shell sized by the short unit stops above the bottom of the screen and the
  // leftover band reads as a chin.
  //
  // So in a standalone app the shell height is published as --app-h: the
  // measured screen height when the shortfall looks like a safe-area strip,
  // otherwise 100vh, which is the unit WebKit reports correctly in standalone
  // (and equals the visible height everywhere else). app.css applies it to the
  // root chain, .app and the full-screen overlays. In Safari, where the browser
  // chrome really does own that space, nothing is published and 100dvh stays in
  // charge.
  var root = document.documentElement;
  var standalone = navigator.standalone === true
    || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!standalone) return;
  function sync() {
    var shown = Math.max(
      window.innerHeight || 0,
      (window.visualViewport && window.visualViewport.height) || 0
    );
    var screenH = (window.screen && screen.height) || 0;
    // A safe-area strip is at most the two insets plus a few px, so that is the
    // size of gap that means "chin". Anything bigger is the keyboard, a rotated
    // or resized window, where screen.height is not the height to fill. env()
    // can read 0 for the first frames, so keep a floor.
    var strip = probe('safe-area-inset-top') + probe('safe-area-inset-bottom');
    var chin = Math.max(120, strip + 40);
    var gap = screenH - shown;
    root.style.setProperty('--app-h', gap > 0 && gap <= chin ? screenH + 'px' : '100vh');
  }
  function probe(prop) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;width:0;height:env(' + prop + ',0px)';
    root.appendChild(d);
    var h = d.getBoundingClientRect().height;
    d.remove();
    return h;
  }
  sync();
  addEventListener('resize', sync);
  addEventListener('orientationchange', sync);
  // WebKit can flip the viewport later (backgrounding, the "dock" it does after
  // any overflow), so re-measure on the events that follow, not just on resize.
  addEventListener('pageshow', sync);
  addEventListener('load', sync);
  document.addEventListener('visibilitychange', sync);
})();
</script>
<style>
  /* Deliberately self-contained: this page is served by the service worker
     when the network is gone, so it must not need a stylesheet, a font or a
     script from anywhere — including from the app shell it is replacing. */
  :root { color-scheme: dark; }
  *, *::before, *::after { box-sizing: border-box; }
  /* --app-h (see the boot script above) is the real screen where iOS
     under-reports its viewport; 100% everywhere else. */
  html, body { height: var(--app-h, 100%); }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse 70% 55% at 50% -10%, #3a2731 0%, transparent 62%),
      #111215;
    color: #f4f0ec;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(28px + env(safe-area-inset-top, 0px))
      calc(22px + env(safe-area-inset-right, 0px))
      calc(28px + env(safe-area-inset-bottom, 0px))
      calc(22px + env(safe-area-inset-left, 0px));
  }
  main {
    width: min(430px, 100%);
    padding: 34px 28px 30px;
    border: 1px solid #ffffff14;
    border-radius: 22px;
    background: linear-gradient(160deg, #221c22 0%, #16161b 100%);
    box-shadow: 0 34px 80px #00000073, inset 0 1px #ffffff12;
    text-align: center;
  }
  .mark {
    width: 58px;
    height: 58px;
    margin: 0 auto 18px;
    border-radius: 15px;
    background: #ff997b;
    display: grid;
    place-items: center;
    transform: rotate(-4deg);
    box-shadow: 0 10px 30px #ff997b2e;
  }
  .mark svg { transform: rotate(4deg); }
  .word {
    margin: 0 0 22px;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -1.2px;
    color: #f6f2ef;
  }
  .word span { color: #ff997b; }
  .eyebrow {
    margin: 0 0 8px;
    color: #ffb49c;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(26px, 7vw, 32px);
    line-height: 1.1;
    letter-spacing: -1.1px;
    font-weight: 800;
  }
  p {
    margin: 0 auto 24px;
    max-width: 34ch;
    color: #ada7af;
    font-size: 13.5px;
    line-height: 1.65;
  }
  .actions { display: grid; gap: 12px; justify-items: center; }
  button, .reload {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 0 26px;
    border-radius: 999px;
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  button {
    border: 0;
    background: #ff997b;
    color: #251914;
  }
  button:hover { background: #ffab92; }
  .reload {
    color: #c9c4cb;
    border: 1px solid #ffffff26;
  }
  .reload:hover { background: #ffffff10; color: #fff; }
  :focus-visible { outline: 2px solid #ffb49c; outline-offset: 3px; }
  .note {
    margin: 24px 0 0;
    color: #86828b;
    font-size: 11px;
    line-height: 1.6;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @media (max-width: 380px) {
    main { padding: 26px 20px 24px; }
    .mark { width: 50px; height: 50px; border-radius: 13px; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#241914"
         stroke-width="2.2" stroke-linecap="round">
      <path d="M2 9v6m4-10v14m4-16v18m4-14v10m4-13v16m4-11v6"/>
    </svg>
  </div>
  <p class="word">sonora<span>.</span></p>
  <p class="eyebrow">Offline</p>
  <h1>No connection right now</h1>
  <p>sonora can't reach your library. Check your network — the app will pick up
    exactly where you left off.</p>
  <div class="actions">
    <button type="button" id="retry">Try again</button>
    <a class="reload" href="/">Reload sonora</a>
  </div>
  <p class="note">Your library, likes and playlists are safe — nothing is lost
    while you're offline.</p>
</main>
<script>
  // No framework, no dependency: a reload is the retry. If the server is still
  // unreachable the service worker serves this page again.
  document.getElementById('retry').addEventListener('click', function () {
    location.reload();
  });
</script>
</body>
</html>
