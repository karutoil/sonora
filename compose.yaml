# sonora — container stack.
#
#   docker compose up -d --build
#   podman compose -f compose.yaml -f compose.podman.yaml up -d --build
#
# Follow logs with the same command plus `logs -f`; use `down` to stop while
# retaining ./data. The port is the same 8130 the dev server uses, so every URL,
# bookmark and tunnel config also works unchanged against `npm start`.
#
# The image runs as node (uid/gid 1000), so Docker needs ./data writable by that
# uid. Rootless Podman instead needs compose.podman.yaml: its keep-id mapping maps
# node to the invoking host account. Without it, container uid 1000 is a subuid and
# the host-owned bind mount is read-only. See README.md for existing data repairs.

services:
  sonora:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/sonora:latest
    container_name: sonora
    restart: unless-stopped
    # The app binds an unprivileged port and never needs Linux capabilities.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Bound fork-bomb damage while leaving ample room for Node, yt-dlp and ffmpeg.
    pids_limit: 256
    # Optional resource ceilings, if desired (uncomment and tune for the host):
    # cpus: 2
    # mem_limit: 2g
    env_file:
      - .env
    environment:
      # Every value here is an override of the documented default, not a hard
      # assignment: `.env` is read for interpolation, so an operator can change
      # HOST/PORT or point the PO-token provider at another host without editing
      # this file. `:-` falls back when the variable is unset *or empty*; `-` only
      # when unset, which is what lets an empty SONORA_POT_PROVIDER/JS_RUNTIME
      # disable that feature (README documents both as "empty disables it").
      #
      # Inside the container the server must listen on all interfaces, not the
      # loopback default, or the published port has nothing behind it.
      HOST: "${HOST:-0.0.0.0}"
      # The host port stays 8130 (the port every URL and bookmark uses); the
      # container port follows PORT so an override does not silently break the
      # published mapping below.
      PORT: "${PORT:-8130}"
      # The bgutil PO-token provider runs as its own container on the host
      # (port 4416). 127.0.0.1 inside a container is the container itself.
      SONORA_POT_PROVIDER: "${SONORA_POT_PROVIDER-http://host.containers.internal:4416}"
      # yt-dlp 2026.x solves YouTube's JS challenges with a runtime. Config
      # auto-detects a deno install under $HOME, which does not exist in this
      # image, so point it at the node binary that is already here.
      SONORA_JS_RUNTIME: "${SONORA_JS_RUNTIME-node:/usr/local/bin/node}"
    ports:
      # Same address and port as dev: loopback only, fronted by the tunnel.
      # Set SONORA_BIND=0.0.0.0 in .env to expose it on the LAN instead.
      # Host 8130 is fixed; the container side follows a PORT override.
      - "${SONORA_BIND:-127.0.0.1}:8130:${PORT:-8130}"
    # Rootless podman adds the keep-id mapping via compose.podman.yaml. It stays
    # out of this file because Docker uses ordinary host uid/gid ownership instead.
    volumes:
      # One directory holds the SQLite db, the materialised cookies.txt and the
      # audio cache — the same layout as a plain `npm start`, so the container
      # and the dev server can share it (not simultaneously). Docker writes as
      # uid/gid 1000; the rootless-Podman override makes writes belong to the
      # invoking host account instead. See the ownership notes above/README.md.
      - ./data:/app/data
    extra_hosts:
      # Needed on older podman releases; harmless where the alias already exists.
      - "host.containers.internal:host-gateway"
    dns:
      # Rootless podman's own forwarder (aardvark-dns) can take seconds to answer
      # every external name, while a real resolver answers in ~1 ms. Node
      # resolves per connection, so that cost lands on every thumbnail and on
      # every yt-dlp lookup. Point the container at a resolver that actually
      # answers; the public defaults work anywhere. Override in .env if your LAN
      # gateway is faster, which it usually is:
      #   SONORA_DNS_1=192.168.1.1
      #   SONORA_DNS_2=1.1.1.1
      - "${SONORA_DNS_1:-1.1.1.1}"
      - "${SONORA_DNS_2:-8.8.8.8}"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    logging:
      # journald is Linux-only. On Docker Desktop (macOS/Windows) the daemon has
      # no journald socket and `docker compose up` fails; comment this block out
      # there to fall back to Docker's default json-file driver.
      driver: journald
      options:
        tag: sonora
